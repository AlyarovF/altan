# ALTAN — CI gate (Step 19). Blocks merges unless typecheck, lint, api tests,
# and app builds all pass. Optionally builds the production Docker images.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # Postgres + Redis for the api test job (unit tests are DB-free today, but
    # the services are provided so DB-backed suites can be added without CI changes).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: altan
          POSTGRES_PASSWORD: altan
          POSTGRES_DB: altan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altan -d altan_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://altan:altan@localhost:5432/altan_test?schema=public
      REDIS_URL: redis://localhost:6379
      # Non-secret placeholders so any env-validated code paths can boot in CI.
      JWT_ACCESS_SECRET: ci_access_secret_placeholder_value
      JWT_REFRESH_SECRET: ci_refresh_secret_placeholder_value
      WEB_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VITE_API_BASE_URL: /api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: API unit tests
        run: pnpm --filter @altan/api test

      - name: Build all apps
        run: pnpm build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: altan/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: altan/web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_SITE_URL=http://localhost
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: altan/admin:ci
          build-args: |
            VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
