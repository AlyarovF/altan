# ALTAN — production stack for the owner's self-managed Linux server.
# Single public entry = the `edge` nginx reverse proxy. Postgres/Redis are
# private (no host ports). Everything is env/secret-driven via .env.production.
#
# Compose file format 2.4 is used deliberately: it supports condition-based
# `depends_on` (service_healthy) on BOTH docker-compose v1.29 and `docker compose` v2.
#
# Bring up with deploy.sh (recommended) or:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
version: '2.4'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-altan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-altan}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-altan} -d ${POSTGRES_DB:-altan}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--loglevel', 'warning']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: altan/api:latest
    restart: unless-stopped
    # Runtime env is interpolated from the --env-file (.env.production) passed by
    # deploy.sh, so the whole config is driven by a single, path-configurable file.
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?ADMIN_ORIGIN is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEDIA_DIR: ${MEDIA_DIR:-/data/media}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5242880}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      # Optional SMTP (owner-provided). Blank -> MailerService stays the log adapter.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SALES_ALERT_EMAIL: ${SALES_ALERT_EMAIL:-}
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck is defined in the image (Node fetch -> /api/v1/health).
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle. Relative base -> browser calls stay same-origin.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    image: altan/web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Server-side (SSR/ISR) calls the API directly on the private network.
      API_INTERNAL_BASE_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
    image: altan/admin:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${EDGE_HTTP_PORT:-80}:80'
      # TLS: uncomment and mount certs (see DEPLOY.md) to terminate HTTPS here.
      # - "${EDGE_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    volumes:
      - ./deploy/edge/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # - ./deploy/edge/certs:/etc/nginx/certs:ro   # mount TLS certs here
    depends_on:
      - web
      - admin
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  media_data:
